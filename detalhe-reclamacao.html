<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reclamação | Portal-Infra</title>

    <!-- copie daqui os mesmos <link> da fonte Inter do reclamacoes.html -->
    <link rel="stylesheet" href="reclamacoes.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
    <script src="comentarios.js" defer></script>
    <script src="detalhe-reclamacao.js" defer></script>

</head>
<body>
  <header class="header">
      <div class="logo"><span>Portal</span> Infra</div>

      <nav>
        <a href="index.html">Início</a>
        <a href="#">Mapa</a>
        <a href="reclamacoes.html" class="active">Reclamações</a>
        <a href="#">Sobre</a>
      </nav>

      <a href="index.html"><button class="btn-secondary">Voltar</button></a>
    </header>

  <main class="container">
    <a href="reclamacoes.html" class="detalhe-voltar">&larr; Voltar para as reclamações</a>

    <p id="detalhe-erro" class="detalhe-erro" hidden></p>

    <article id="detalhe" class="detalhe-pagina" hidden>
      <div class="detalhe-imagem"><img id="detalhe-foto" alt="" /></div>
      <div class="detalhe-corpo">
        <div class="detalhe-tags">
          <span id="detalhe-status" class="status"></span>
          <span id="detalhe-categoria" class="detalhe-categoria"></span>
        </div>
        <h1 id="detalhe-titulo"></h1>
        <p class="detalhe-local" id="detalhe-local"></p>
        <p class="detalhe-descricao" id="detalhe-descricao"></p>
        <dl class="detalhe-info">
          <div><dt>Gravidade</dt><dd id="detalhe-gravidade"></dd></div>
          <div><dt>Registrada em</dt><dd id="detalhe-data"></dd></div>
          <div><dt>Protocolo</dt><dd id="detalhe-id"></dd></div>
        </dl>
      </div>
    </article>
    <section id="comentarios" class="detalhe-comentarios" hidden>
    <h2>Comentários</h2>
    <div class="detalhe-comentar">
        <textarea id="novo-comentario-texto" placeholder="Comente algo sobre esta reclamação..."></textarea>
        <button type="button" onclick="enviarComentarioPrincipal()">Publicar</button>
    </div>
    <div id="lista-comentarios"></div>
    </section>
  </main>

  <!-- copie o <footer> do reclamacoes.html -->
</body>
</html>
